name: update-vendor-skills

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update:
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: h3y6e/gh-skill-update-action@v1.2.0
        with:
          dir: .vendor/skills
